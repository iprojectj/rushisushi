kind = "web"
previewPath = "/"
title = "Rushi Sushi"
description = "Importação do site Rushi Sushi a partir do repositório público, preservando a experiência de pedidos, páginas de suporte, área administrativa e integrações existentes."
version = "1.0.0"
id = "artifacts/rushi-sushi"
router = "path"

[[services]]
name = "web"
paths = ["/"]
localPort = 25664

[services.development]
run = "pnpm --filter @workspace/rushi-sushi run dev"

[services.env]
PORT = "25664"
BASE_PATH = "/"

[services.production.build]
args = ["pnpm", "--filter", "@workspace/rushi-sushi", "run", "build"]

[services.production.build.env]
NODE_ENV = "production"
PORT = "25664"
BASE_PATH = "/"

[services.production.run]
args = ["node", "--enable-source-maps", "artifacts/rushi-sushi/.output/server/index.mjs"]

[services.production.run.env]
NODE_ENV = "production"
PORT = "25664"
BASE_PATH = "/"

[services.production.health.startup]
path = "/"
