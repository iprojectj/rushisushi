kind = "web"
previewPath = "/"
title = "Rushi Sushi"
description = "Importação do site Rushi Sushi a partir do repositório público, preservando a experiência de pedidos, páginas de suporte, área administrativa e integrações existentes."
version = "1.0.0"
id = "artifacts/rushi-sushi"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 25664

[services.development]
run = "pnpm --filter @workspace/rushi-sushi run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/rushi-sushi", "run", "build" ]
serve = "static"
publicDir = "artifacts/rushi-sushi/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "25664"
BASE_PATH = "/"
